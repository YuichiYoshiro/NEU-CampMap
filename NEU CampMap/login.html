<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEU CampMap — Institutional Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-900/75 backdrop-blur-sm min-h-screen flex items-center justify-center p-4 text-slate-900 select-none">

  <!-- DEDICATED LOGIN PAGE CARD -->
  <div id="authModal" class="bg-white rounded-3xl shadow-2xl border border-slate-200 w-full max-w-md overflow-hidden transition-opacity">
    <div class="px-6 pt-7 pb-6 bg-gradient-to-br from-[#006837] via-[#075E34] to-[#004D29] text-white text-center relative overflow-hidden">
      <div class="w-14 h-14 rounded-2xl bg-[#F4B400] text-[#004D29] flex items-center justify-center shadow-lg mx-auto mb-3 ring-4 ring-white/15">
        <i class="fa-solid fa-compass text-2xl"></i>
      </div>
      <h1 class="text-xl font-extrabold tracking-tight">NEU CampMap Portal</h1>
      <p class="text-xs text-emerald-100 mt-1 font-medium">New Era University • Central Avenue Campus</p>
    </div>

    <form id="authForm" onsubmit="handleAuthSubmit(event)" class="p-6 space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Institutional Email</label>
        <div class="flex rounded-xl overflow-hidden border border-slate-200 focus-within:ring-2 focus-within:ring-[#006837]/25 focus-within:border-[#006837]">
          <input type="text" id="authEmailPrefix" placeholder="e.g. juandelacruz" class="w-full px-3.5 py-2.5 bg-slate-50 text-sm focus:outline-none" required />
          <span class="bg-slate-100 border-l border-slate-200 px-3 py-2.5 text-xs font-semibold text-slate-600 flex items-center">@neu.edu.ph</span>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Password</label>
        <input type="password" id="authPassword" placeholder="••••••••••••" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#006837]/25 focus:border-[#006837]" required />
      </div>

      <div id="authErrorMsg" class="hidden text-xs text-rose-600 font-medium bg-rose-50 p-3 rounded-xl border border-rose-200 flex items-center gap-2">
        <i class="fa-solid fa-circle-exclamation shrink-0"></i>
        <span id="authErrorText">Invalid credentials.</span>
      </div>

      <button type="submit" id="authSubmitBtn" class="w-full py-3 rounded-xl bg-[#006837] hover:bg-[#00522B] text-white font-bold text-sm shadow-md flex items-center justify-center gap-2 transition-all active:scale-[0.99]">
        <span>Sign In to CampMap</span>
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </button>

    </form>
  </div>

  <script src="auth.js"></script>
</body>
</html>
